name: Build rootfs and package

on:
  workflow_call:
    inputs:
      device:
        required: true
        type: string
      devicesrc:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      device:
        required: true
        type: string
      devicesrc:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout configs
        uses: actions/checkout@v4

      - name: Setup pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          chmod +x -v pmbootstrap/pmbootstrap.py

      - name: Configure pmbootstrap
        run: |
          mkdir -p /home/runner/.config
          # Use config file from this repo (checked out above)
          cp device/${{ inputs.device }}/pmbootstrap_v3.cfg /home/runner/.config/pmbootstrap_v3.cfg
          chmod 644 -v /home/runner/.config/pmbootstrap_v3.cfg
          # Pre-create work directory to avoid interactive prompt
          mkdir -p /home/runner/.local/var/pmbootstrap/cache_git
          echo "8" > /home/runner/.local/var/pmbootstrap/version

      - name: Initialize pmbootstrap & prepare device package
        run: |
          # First init to clone pmaports (use qemu which always exists)
          echo -e '\n\n\n\n\n\n\n\n\n\n' | ./pmbootstrap/pmbootstrap.py --details-to-stdout init || true

          DEVICE_DIR="/home/runner/.local/var/pmbootstrap/cache_git/pmaports/device/testing"
          DEVICE_PKG="device-${{ inputs.device }}"
          LINUX_PKG="linux-${{ inputs.device }}"

          # Only clone device repo if devicesrc provided AND pmaports doesn't have it
          if [ -n "${{ inputs.devicesrc }}" ] && [ ! -d "${DEVICE_DIR}/${DEVICE_PKG}" ]; then
            git clone --depth=1 ${{ inputs.devicesrc }} /tmp/device-pkg
            cp -r /tmp/device-pkg/* "${DEVICE_DIR}/"
            echo "device_repo_cloned=true" >> $GITHUB_ENV
          else
            echo "device_repo_cloned=false" >> $GITHUB_ENV
          fi

          echo "DEVICE_DIR=${DEVICE_DIR}" >> $GITHUB_ENV
          echo "DEVICE_PKG=${DEVICE_PKG}" >> $GITHUB_ENV
          echo "LINUX_PKG=${LINUX_PKG}" >> $GITHUB_ENV

      - name: Build packages
        run: |
          set -e
          if [ -d "${{ env.DEVICE_DIR }}/${{ env.LINUX_PKG }}" ]; then
            ./pmbootstrap/pmbootstrap.py --details-to-stdout checksum "${{ env.LINUX_PKG }}"
            ./pmbootstrap/pmbootstrap.py --details-to-stdout build "${{ env.LINUX_PKG }}" --force
          fi
          ./pmbootstrap/pmbootstrap.py --details-to-stdout checksum "${{ env.DEVICE_PKG }}"
          ./pmbootstrap/pmbootstrap.py --details-to-stdout build "${{ env.DEVICE_PKG }}" --force
          FIRMWARE_PKG="firmware-${{ inputs.device }}"
          if [ -d "${{ env.DEVICE_DIR }}/${FIRMWARE_PKG}" ]; then
            ./pmbootstrap/pmbootstrap.py --details-to-stdout checksum "${FIRMWARE_PKG}"
            ./pmbootstrap/pmbootstrap.py --details-to-stdout build "${FIRMWARE_PKG}" --force
          fi

      - name: Build rootfs
        run: yes '123456' | ./pmbootstrap/pmbootstrap.py --details-to-stdout install --android-recovery-zip --recovery-install-partition=data

      - name: Export rootfs
        run: ./pmbootstrap/pmbootstrap.py --details-to-stdout export

      - name: Upload log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ inputs.device }}
          path: /home/runner/.local/var/pmbootstrap/log.txt
          if-no-files-found: ignore

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ inputs.device }}
          path: /tmp/postmarketOS-export/*
          if-no-files-found: ignore
          retention-days: 30
