name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: xiaomi-lmi
            devicesrc: https://github.com/NekoSekaiMoe/pmos_xiaomi_lmi
          - device: xiaomi-raphael
            devicesrc: ''
          - device: xiaomi-begonia
            devicesrc: https://github.com/criollojoel10/begonia-pmos-tianma

    uses: ./.github/workflows/main.yml
    with:
      device: ${{ matrix.device }}
      devicesrc: ${{ matrix.devicesrc }}
