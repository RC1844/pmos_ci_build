name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: xiaomi-lmi
            devicesrc: https://github.com/NekoSekaiMoe/pmos_xiaomi_lmi
          - device: xiaomi-raphael
            devicesrc: ''
          - device: xiaomi-begonia
            devicesrc: https://github.com/criollojoel10/begonia-pmos-tianma

    uses: ./.github/workflows/main.yml
    with:
      device: ${{ matrix.device }}
      devicesrc: ${{ matrix.devicesrc }}

  release:
    # Only create release when a version tag is pushed
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all rootfs artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Display structure of downloaded files
        run: find artifacts -type f

      - name: Create GitHub Release & Upload
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
